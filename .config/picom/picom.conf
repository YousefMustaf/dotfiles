########################################
# GENERAL
########################################

backend = "glx";
vsync = true;

# Don't use shadows
shadow = false;

# Don't use blur
blur = false;

# Don't use fading on startup/shutdown
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# Rounded corners
corner-radius = 12;

# Don't round fullscreen windows
rounded-corners-exclude = [
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# Don't try to detect rounded corners from the window itself
detect-rounded-corners = true;


########################################
# TRANSPARENCY
########################################

# General transparency
inactive-opacity = 0.85;
active-opacity = 1.0;

# Don't make frame opacity affect child windows
frame-opacity = 1.0;

# Respect applications' own opacity settings
detect-client-opacity = true;


########################################
# WINDOW OPACITY
########################################

# You can add specific applications here later.
# Example:
#
# opacity-rule = [
#     "90:class_g = 'Alacritty'",
#     "90:class_g = 'kitty'"
# ];


########################################
# PERFORMANCE
########################################

# Prevent unnecessary damage tracking
use-damage = true;

# Don't repaint transparent regions unnecessarily
transparent-clipping = false;


########################################
# WINDOW DETECTION
########################################

detect-client-leader = true;
detect-transient = true;
detect-client-opacity = true;


########################################
# BACKGROUND
########################################

# Keep backgrounds opaque unless the application
# explicitly requests transparency.
inactive-opacity-override = false;


########################################
# GLX
########################################


########################################
# OTHER
########################################

# Don't use shadows
no-dock-shadow = true;
no-dnd-shadow = true;

# Don't fade menus/tooltips unnecessarily
wintypes:
{
    tooltip = { fade = true; shadow = false; opacity = 0.95; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.95; };
    dropdown_menu = { opacity = 0.95; };
};


########################################
############## NVIM ####################
########################################

opacity-rule = [
    "85:class_g = 'nvim-trans'"
];


########################################
############## Alacritty ###############
########################################

opacity-rule = [
  "85:class_g = 'Alacritty'"
];


