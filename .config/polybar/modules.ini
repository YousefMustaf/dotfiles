;label-discharging = %percentage%%
;
;ramp-capacity-0 = 󰂎
;ramp-capacity-1 = 󰁺
;ramp-capacity-2 = 󰁻
;ramp-capacity-3 = 󰁼
;ramp-capacity-4 = 󰁽
;ramp-capacity-5 = 󰁾
;ramp-capacity-6 = 󰁿
;ramp-capacity-7 = 󰂀
;ramp-capacity-8 = 󰂁
;ramp-capacity-9 = 󰁹
;
;animation-charging-0 = 󰂄
;animation-charging-1 = 󰂅
;animation-charging-framerate = 750

