;label-warn =  %temperature-c%
;label-warn-foreground = ${colors.red}


;=========================================================
;
; modules.ini
; Part 3
; Updates | Wallpaper | Media | VPN | Bluetooth
; Date | Power Menu
;
;=========================================================

;---------------------------------------------------------
; Pacman Updates
;---------------------------------------------------------

[module/updates]
type = custom/script

exec = ~/.config/polybar/scripts/updates.sh

interval = 600

format-prefix = "󰏗 "
format-prefix-foreground = ${colors.yellow}

label = %output%

click-left = kitty -e ~/.config/polybar/scripts/update-system.sh

;---------------------------------------------------------
; Wallpaper
;---------------------------------------------------------

[module/wallpaper]
type = custom/text

content = 󰸉

content-padding = 2

content-foreground = ${colors.blue}

click-left = ~/random-wallpaper

;---------------------------------------------------------
; Media Player
;---------------------------------------------------------

[module/media]
type = custom/script

exec = ~/.config/polybar/scripts/media.sh

interval = 1

tail = true

click-left = playerctl play-pause
click-right = playerctl next
click-middle = playerctl previous

;---------------------------------------------------------
; VPN
;---------------------------------------------------------

[module/vpn]
type = custom/script

exec = ~/.config/polybar/scripts/vpn.sh

interval = 5

click-left = kitty -e nmcli connection show

;---------------------------------------------------------
; Bluetooth
;---------------------------------------------------------

[module/bluetooth]
type = custom/script

exec = ~/.config/polybar/scripts/bluetooth.sh

interval = 5

click-left = blueman-manager

;---------------------------------------------------------
; Date & Time
;---------------------------------------------------------

[module/date]
type = internal/date

interval = 1

date = %a %d %b

time = %H:%M

label =  %date%   %time%

label-foreground = ${colors.foreground}

click-left = gsimplecal

;---------------------------------------------------------
; Power Menu
;---------------------------------------------------------

[module/powermenu]
type = custom/text

content = ⏻

content-padding = 2

content-foreground = ${colors.red}

click-left = ~/.config/polybar/scripts/powermenu.sh
