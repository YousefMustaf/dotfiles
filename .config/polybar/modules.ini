;=========================================================
;
; modules.ini
; Part 1
; Launcher | i3 | Window | CPU | Memory
;
;=========================================================

;---------------------------------------------------------
; Launcher
;---------------------------------------------------------

[module/launcher]
type = custom/text

content = 
content-font = 3

content-padding = 2

content-foreground = ${colors.blue}

click-left = rofi -show drun

;---------------------------------------------------------
; i3 Workspaces
;---------------------------------------------------------

[module/i3]
type = internal/i3

pin-workspaces = true
strip-wsnumbers = false
index-sort = true

enable-click = true
enable-scroll = true

wrapping-scroll = false

format = <label-state>

label-focused = %index%
label-focused-background = ${colors.surface}
label-focused-foreground = ${colors.foreground}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.disabled}
label-unfocused-padding = 2

label-visible = %index%
label-visible-background = ${colors.surface}
label-visible-foreground = ${colors.foreground}
label-visible-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 2

;---------------------------------------------------------
; Active Window Title
;---------------------------------------------------------

[module/xwindow]
type = internal/xwindow

label = %title%

label-maxlen = 60

label-empty = Desktop

label-foreground = ${colors.foreground-alt}

;---------------------------------------------------------
; CPU
;---------------------------------------------------------

[module/cpu]
type = internal/cpu

interval = 2

format = <label>

format-prefix = " "
format-prefix-foreground = ${colors.red}

label = %percentage%%

click-left = kitty -e btop

;---------------------------------------------------------
; Memory
;---------------------------------------------------------

[module/memory]
type = internal/memory

interval = 2

format = <label>

format-prefix = "󰍛 "
format-prefix-foreground = ${colors.purple}

label = %gb_used% / %gb_total%

click-left = kitty -e btop



;=========================================================
;
; modules.ini
; Part 2
; Ethernet | WiFi | Audio | Battery | Brightness | Temp
;
;=========================================================

;---------------------------------------------------------
; Ethernet (Desktop)
;---------------------------------------------------------

[module/ethernet]
type = internal/network

interface = enp0s25

interval = 3

format-connected = <label-connected>
format-disconnected = <label-disconnected>

label-connected = 󰈀 %local_ip%
label-connected-foreground = ${colors.green}

label-disconnected = 󰈂 Disconnected
label-disconnected-foreground = ${colors.red}

click-left = kitty -e nmtui

;=========================================================
;
; LAPTOP MODULES
;
; Uncomment after buying your laptop.
;
; Replace:
;
; interface = wlp0s20f3
; battery = BAT0
; card = intel_backlight
;
;=========================================================

;---------------------------------------------------------
; WiFi
;---------------------------------------------------------

;[module/wifi]
;type = internal/network
;
;interface = wlp0s20f3
;
;interval = 3
;
;format-connected = <label-connected>
;format-disconnected = <label-disconnected>
;
